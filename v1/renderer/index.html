<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Coherence P2P - Social Network</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">

    <!-- LEFT SIDEBAR: Usuário, Perfil, Links -->
    <aside class="left-sidebar">
      <div class="rail-block identity-block">
        <div class="identity-name" id="my-name">—</div>
        
        <!-- Avatar Section -->
        <div id="avatar-section" class="avatar-section" title="Clique para alterar avatar">
          <div class="avatar-placeholder" id="avatar-display">
            <span class="avatar-initials">?</span>
          </div>
          <input type="file" id="avatar-upload" accept="image/*" hidden />
        </div>

        <!-- Public Key Display - Copyable -->
        <div class="identity-key" id="my-key" title="Clique para copiar para área de trabalho">
          <span id="key-text">—</span>
          <span id="copy-feedback" hidden class="copy-feedback">copiado!</span>
        </div>

        <!-- Status Indicator -->
        <div class="identity-status">
          <span class="dot dot--online" id="status-dot"></span>
          <span id="status-text">conectando…</span>
        </div>
      </div>

      <!-- Profile Edit Form -->
      <form class="rail-block" id="profile-form">
        <label class="field">
          <span>nome</span>
          <input type="text" id="profile-nome" maxlength="60" />
        </label>
        <label class="field">
          <span>bio</span>
          <textarea id="profile-bio" maxlength="240" rows="3"></textarea>
        </label>
        
        <!-- Links Manager -->
        <div class="links-section">
          <div class="eyebrow">links (máximo 3)</div>
          <ul class="links-list" id="links-list"></ul>
          <button type="button" id="add-link-btn" class="btn btn--ghost btn--small">+ adicionar link</button>
        </div>

        <!-- Save Button -->
        <div class="form-actions">
          <button type="submit" class="btn btn--accent btn--small">salvar</button>
        </div>
      </form>
    </aside>

    <!-- CENTER AREA: Composer, Feed, Profile View, Search View -->
    <main class="center-area">
      <!-- Profile View Container (hidden by default) -->
      <div id="profile-view-container" class="profile-view-container" hidden>
        <button id="back-to-feed-btn" class="btn btn--ghost btn--small">← voltar</button>
        <div id="profile-view" class="profile-view"></div>
      </div>

      <!-- Search View Container (hidden by default) -->
      <div id="search-view-container" class="search-view-container" hidden>
        <button id="back-to-feed-from-search-btn" class="btn btn--ghost btn--small">← voltar</button>
        <div class="eyebrow" style="margin-bottom: 16px;">pesquisar usuários</div>
        <div class="search-form">
          <input type="text" id="search-input" placeholder="buscar por nome ou chave…" />
          <button id="search-btn" type="button" class="btn btn--accent btn--small">pesquisar</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>

      <!-- Composer Form (only show when viewing feed) -->
      <form class="composer" id="composer-form">
        <textarea id="composer-text" placeholder="transmitir algo para a rede…" rows="3"></textarea>
        <div class="composer-row">
          <label class="composer-image-label">
            <input type="file" id="composer-image" accept="image/*" hidden />
            <span id="composer-image-name">+ imagem</span>
          </label>
          <button type="submit" class="btn btn--accent">publicar</button>
        </div>
        <p class="form-error" id="composer-error" hidden></p>
      </form>

      <!-- Feed -->
      <div class="feed" id="feed">
        <p class="feed-empty" id="feed-empty" hidden>nenhuma transmissão ainda. publique a primeira, ou siga alguém.</p>
      </div>
    </main>

    <!-- RIGHT SIDEBAR: Following/Followers List -->
    <aside class="right-sidebar">
      <button id="open-search-btn" type="button" class="btn btn--ghost btn--small" style="width: 100%; text-align: left; margin-bottom: 16px;">🔍 pesquisar</button>
      
      <!-- Tabs -->
      <div class="sidebar-tabs">
        <button id="tab-following" class="tab-btn tab-btn--active">seguindo</button>
        <button id="tab-followers" class="tab-btn">seguidores</button>
      </div>
      
      <!-- Following List -->
      <div id="tab-content-following" class="tab-content">
        <div class="rail-block">
          <div class="eyebrow">seguindo <span id="following-count">(0)</span></div>
          <form id="follow-form" class="follow-form">
            <input type="text" id="follow-key" placeholder="colar chave pública (hex)" autocomplete="off" />
            <button type="submit" class="btn btn--accent btn--small">seguir</button>
          </form>
          <p class="form-error" id="follow-error" hidden></p>
          <ul class="following-list" id="following-list"></ul>
        </div>
      </div>
      
      <!-- Followers List -->
      <div id="tab-content-followers" class="tab-content" hidden>
        <div class="rail-block">
          <div class="eyebrow">seguidores <span id="followers-count">(0)</span></div>
          <ul class="followers-list" id="followers-list"></ul>
        </div>
      </div>
    </aside>

  </div>

  <template id="post-template">
    <article class="post">
      <header class="post-header">
        <span class="post-author"></span>
        <span class="post-time"></span>
      </header>
      <div class="post-body"></div>
      <img class="post-image" hidden />
      <footer class="post-footer"></footer>
    </article>
  </template>

  <template id="peer-template">
    <li class="peer">
      <div class="peer-status">
        <span class="dot dot--online peer-status-dot"></span>
      </div>
      <div class="peer-info">
        <span class="peer-name"></span>
        <span class="peer-key"></span>
      </div>
      <div class="peer-actions">
        <button type="button" class="btn btn--ghost btn--tiny peer-copy-key" title="Copiar chave">📋</button>
        <button type="button" class="btn btn--ghost btn--tiny peer-unfollow" title="Deixar de seguir">✕</button>
      </div>
    </li>
  </template>

  <template id="link-template">
    <li class="link-item">
      <div class="link-content">
        <a href="#" target="_blank" rel="noopener" class="link-title"></a>
      </div>
      <button type="button" class="btn btn--ghost btn--tiny link-remove">✕</button>
    </li>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
