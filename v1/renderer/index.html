<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Coherence P2P - Social Network</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section id="setup-screen" class="setup-screen" hidden>
    <div class="setup-panel">
      <div class="setup-mark">COHERENCE</div>
      <h1 data-i18n="welcomeTitle">Bem-vindo ao Coherence</h1>
      <p class="setup-lead" data-i18n="welcomeLead">Uma rede social distribuída, sob seu controle.</p>

      <label class="field setup-locale-field">
        <span data-i18n="language">idioma</span>
        <select id="setup-locale" class="setup-select">
          <option value="pt-BR">Português (pt-BR)</option>
          <option value="en-US">English (en-US)</option>
        </select>
      </label>

      <div class="setup-actions">
        <button id="setup-import" type="button" class="btn btn--ghost" data-i18n="importIdentity">importar chaves</button>
        <button id="setup-create" type="button" class="btn btn--accent" data-i18n="createAccount">criar nova conta</button>
      </div>

      <div id="setup-recovery" class="setup-recovery" hidden>
        <div id="setup-recovery-anim" class="recovery-anim" aria-hidden="true">
          <div class="recovery-anim__ring recovery-anim__ring--outer"></div>
          <div class="recovery-anim__ring recovery-anim__ring--inner"></div>
          <div class="recovery-anim__sweep"></div>
          <div class="recovery-anim__core"></div>
          <div class="recovery-anim__blip recovery-anim__blip--1" hidden></div>
          <div class="recovery-anim__blip recovery-anim__blip--2" hidden></div>
          <div class="recovery-anim__blip recovery-anim__blip--3" hidden></div>
        </div>
        <p id="setup-recovery-status" class="setup-status setup-status--phase"></p>
        <p id="setup-recovery-meta" class="setup-status setup-status--meta" hidden></p>
        <div class="setup-recovery__actions">
          <button id="setup-start-from-zero" type="button" class="btn btn--danger" data-i18n="startFromZero">começar do zero</button>
          <button id="setup-cancel-recovery" type="button" class="btn btn--ghost" data-i18n="cancelAndClose">cancelar e fechar</button>
        </div>
      </div>

      <form id="setup-create-form" class="setup-create-form" hidden>
        <label class="field">
          <span data-i18n="username">nome de usuário</span>
          <input id="setup-username" type="text" maxlength="30" autocomplete="off" required />
        </label>
        <button type="submit" class="btn btn--accent" data-i18n="confirm">confirmar</button>
      </form>
      <p id="setup-error" class="form-error" hidden></p>
      <p id="setup-status" class="setup-status" hidden></p>
    </div>
  </section>

  <div class="app">

    <!-- LEFT SIDEBAR: User, Profile, Links -->
    <aside class="left-sidebar">
      <div class="rail-block identity-block">
        <div class="identity-name" id="my-name">—</div>
        
        <!-- Avatar Section -->
        <div id="avatar-section" class="avatar-section" title="Clique para alterar avatar" data-i18n-title="avatarTitle">
          <div class="avatar-placeholder" id="avatar-display">
            <span class="avatar-initials">?</span>
          </div>
          <input type="file" id="avatar-upload" accept="image/*" hidden />
        </div>

        <!-- Public Key Display - Copyable -->
        <div class="identity-key" id="my-key" title="Clique para copiar para área de trabalho" data-i18n-title="copyKeyTitle">
          <span id="key-text">—</span>
          <span id="copy-feedback" hidden class="copy-feedback" data-i18n="copied">copiado!</span>
        </div>

        <!-- Status Indicator -->
        <div class="identity-status">
          <span class="dot dot--online" id="status-dot"></span>
          <span id="status-text" data-i18n="connecting">conectando…</span>
        </div>
      </div>

      <!-- Profile Edit Form -->
      <form class="rail-block" id="profile-form">
        <label class="field">
          <span data-i18n="name">nome</span>
          <input type="text" id="profile-nome" maxlength="60" />
        </label>
        <label class="field">
          <span data-i18n="bio">bio</span>
          <textarea id="profile-bio" maxlength="240" rows="3"></textarea>
        </label>
        
        <!-- Links Manager -->
        <div class="links-section">
          <div class="eyebrow" data-i18n="linksMax">links (máximo 3)</div>
          <ul class="links-list" id="links-list"></ul>
          <button type="button" id="add-link-btn" class="btn btn--ghost btn--small" data-i18n="addLink">+ adicionar link</button>
        </div>

        <!-- Save Button -->
        <div class="form-actions">
          <button type="submit" class="btn btn--accent btn--small" data-i18n="save">salvar</button>
        </div>
      </form>
    </aside>

    <!-- CENTER AREA: Composer, Feed, Profile View, Search View -->
    <main class="center-area">
      <!-- Profile View Container (hidden by default) -->
      <div id="profile-view-container" class="profile-view-container" hidden>
        <button id="back-to-feed-btn" class="btn btn--ghost btn--small" data-i18n="back">← voltar</button>
        <div id="profile-view" class="profile-view"></div>
      </div>

      <!-- Search View Container (hidden by default) -->
      <div id="search-view-container" class="search-view-container" hidden>
        <button id="back-to-feed-from-search-btn" class="btn btn--ghost btn--small" data-i18n="back">← voltar</button>
        <div class="eyebrow" style="margin-bottom: 16px;" data-i18n="searchUsersTitle">pesquisar usuários</div>
        <div class="search-form">
          <input type="text" id="search-input" placeholder="buscar por nome ou chave…" data-i18n-placeholder="searchPlaceholder" />
          <button id="search-btn" type="button" class="btn btn--accent btn--small" data-i18n="search">pesquisar</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>

      <!-- Update banner (shown when a newer release is available) -->
      <div id="update-banner" class="update-banner" hidden>
        <span id="update-banner-text"></span>
        <a href="#" id="update-banner-link" class="update-banner-link"></a>
        <button id="update-banner-close" type="button" class="update-banner-close" aria-label="close">×</button>
      </div>

      <!-- Composer Form (only show when viewing feed) -->
      <form class="composer" id="composer-form">
        <textarea id="composer-text" placeholder="transmitir algo para a rede…" rows="3" data-i18n-placeholder="composerPlaceholder"></textarea>
        <div class="composer-row">
          <label class="composer-image-label">
            <input type="file" id="composer-image" accept="image/*" hidden />
            <span id="composer-image-name" data-i18n="addImage">+ imagem</span>
          </label>
          <button type="submit" class="btn btn--accent" data-i18n="publish">publicar</button>
        </div>
        <p class="form-error" id="composer-error" hidden></p>
      </form>

      <!-- Feed -->
      <div class="feed" id="feed">
        <p class="feed-empty" id="feed-empty" hidden data-i18n="feedEmpty">nenhuma transmissão ainda. publique a primeira, ou siga alguém.</p>
      </div>
    </main>

    <!-- RIGHT SIDEBAR: Following/Followers List -->
    <aside class="right-sidebar">
      <button id="open-settings-btn" type="button" class="btn btn--ghost btn--small settings-button" title="Configurações" data-i18n-title="settings">⚙ <span data-i18n="settings">configurações</span></button>
      <button id="open-search-btn" type="button" class="btn btn--ghost btn--small" style="width: 100%; text-align: left; margin-bottom: 16px;">🔍 <span data-i18n="search">pesquisar</span></button>
      
      <!-- Tabs -->
      <div class="sidebar-tabs">
        <button id="tab-following" class="tab-btn tab-btn--active" data-i18n="following">seguindo</button>
        <button id="tab-followers" class="tab-btn" data-i18n="followers">seguidores</button>
      </div>
      
      <!-- Following List -->
      <div id="tab-content-following" class="tab-content">
        <div class="rail-block">
          <div class="eyebrow"><span data-i18n="following">seguindo</span> <span id="following-count">(0)</span></div>
          <form id="follow-form" class="follow-form">
            <input type="text" id="follow-key" placeholder="colar chave pública (hex)" autocomplete="off" data-i18n-placeholder="followPlaceholder" />
            <button type="submit" class="btn btn--accent btn--small" data-i18n="follow">seguir</button>
          </form>
          <p class="form-error" id="follow-error" hidden></p>
          <ul class="following-list" id="following-list"></ul>
        </div>
      </div>
      
      <!-- Followers List -->
      <div id="tab-content-followers" class="tab-content" hidden>
        <div class="rail-block">
          <div class="eyebrow"><span data-i18n="followers">seguidores</span> <span id="followers-count">(0)</span></div>
          <ul class="followers-list" id="followers-list"></ul>
        </div>
      </div>
    </aside>

  </div>

  <div id="settings-modal" class="modal-overlay" hidden>
    <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header">
        <h2 id="settings-title" data-i18n="settings">configurações</h2>
        <button id="close-settings-btn" type="button" class="btn btn--ghost btn--tiny" data-i18n="close">fechar</button>
      </header>
      <nav class="settings-tabs" aria-label="Settings">
        <button type="button" class="tab-btn tab-btn--active" data-settings-tab="settings" data-i18n="settings">configurações</button>
        <button type="button" class="tab-btn" data-settings-tab="about" data-i18n="about">sobre</button>
        <button type="button" class="tab-btn" data-settings-tab="faq" data-i18n="faq">FAQ</button>
      </nav>
      <div class="settings-body">
        <div data-settings-panel="settings">
          <label class="field settings-locale-field"><span data-i18n="settingsLanguage">idioma</span>
            <select id="settings-locale" class="setup-select"><option value="pt-BR">Português (pt-BR)</option><option value="en-US">English (en-US)</option></select>
          </label>
          <div class="settings-actions">
            <button id="export-identity-btn" type="button" class="btn btn--ghost" data-i18n="exportIdentity">exportar identidade</button>
            <button id="reset-app-btn" type="button" class="btn btn--danger" data-i18n="resetApp">resetar aplicação</button>
          </div>
          <p id="settings-status" class="settings-status" hidden></p>
          <div class="update-check">
            <button id="check-updates-btn" type="button" class="btn btn--ghost btn--small" data-i18n="checkForUpdates">verificar atualizações</button>
            <p id="updates-status" class="settings-status" hidden></p>
          </div>
        </div>
        <div id="about-panel" data-settings-panel="about" hidden></div>
        <div id="faq-panel" data-settings-panel="faq" hidden></div>
      </div>
    </section>
  </div>

  <template id="post-template">
    <article class="post">
      <header class="post-header">
        <span class="post-author"></span>
        <span class="post-time"></span>
      </header>
      <div class="post-body"></div>
      <img class="post-image" hidden />
      <footer class="post-footer"></footer>
    </article>
  </template>

  <template id="peer-template">
    <li class="peer">
      <div class="peer-status">
        <span class="dot dot--online peer-status-dot"></span>
      </div>
      <div class="peer-info">
        <span class="peer-name"></span>
        <span class="peer-key"></span>
      </div>
      <div class="peer-actions">
        <button type="button" class="btn btn--ghost btn--tiny peer-copy-key" title="Copiar chave" data-i18n-title="copyKey">📋</button>
        <button type="button" class="btn btn--ghost btn--tiny peer-unfollow" title="Deixar de seguir" data-i18n-title="unfollow">✕</button>
      </div>
    </li>
  </template>

  <template id="link-template">
    <li class="link-item">
      <div class="link-content">
        <a href="#" target="_blank" rel="noopener" class="link-title"></a>
      </div>
      <button type="button" class="btn btn--ghost btn--tiny link-remove">✕</button>
    </li>
  </template>

  <script src="i18n.js"></script>
  <script src="setup.js"></script>
  <script src="ConfirmDialog.js"></script>
  <script src="AboutTab.js"></script>
  <script src="FAQTab.js"></script>
  <script src="SettingsScreen.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
