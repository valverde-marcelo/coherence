<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Coherence</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #e6edf3; padding: 20px;
  }
  h1 { font-size: 16px; margin-bottom: 4px; color: #6366f1; }
  p.sub { font-size: 13px; color: #8b949e; margin-bottom: 16px; }
  .accounts { display: flex; flex-direction: column; gap: 8px; }
  .account {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 12px; cursor: pointer; color: #e6edf3; font-size: 14px;
    text-align: left; font-family: inherit;
  }
  .account:hover { border-color: #6366f1; background: #1f2630; }
  .account .badge {
    width: 28px; height: 28px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; background: #6366f1;
    color: #fff; font-weight: 600; font-size: 12px; flex: 0 0 auto;
  }
  .account .key { color: #8b949e; font-size: 12px; font-family: ui-monospace, monospace; margin-top: 2px; }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
    background: #21262d; color: #e6edf3; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  .btn:hover { border-color: #6366f1; }
</style>
</head>
<body>
  <h1>Coherence</h1>
  <p class="sub">Múltiplas contas locais encontradas. Escolha qual abrir:</p>
  <div id="accounts" class="accounts"></div>
  <div class="actions">
    <button id="new-account" class="btn">criar nova conta</button>
    <button id="cancel" class="btn">cancelar</button>
  </div>
  <script src="picker.js"></script>
</body>
</html>
